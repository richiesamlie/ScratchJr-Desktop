name: Build Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.3.8). Leave empty to build the latest tag."
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build for ${{ matrix.release_suffix }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release_suffix: ubuntu
            artifact_name: ScratchJr-linux-x64.zip
          - os: ubuntu-latest
            release_suffix: ubuntu-arm64
            artifact_name: ScratchJr-linux-arm64.zip
          - os: macos-latest
            release_suffix: mac
            artifact_name: ScratchJr-darwin-x64.zip
          - os: macos-latest
            release_suffix: mac-arm64
            artifact_name: ScratchJr-darwin-arm64.zip
          - os: windows-latest
            release_suffix: windows
            artifact_name: ScratchJr-win32-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build and package
        shell: bash
        env:
          # Code signing: set these secrets in GitHub repo settings when available
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm run build:renderer
          if [[ "${{ matrix.release_suffix }}" == *"arm64"* ]]; then
            npm_config_arch=arm64 npm run make:zip
          else
            npm run make:zip
          fi

      - name: Rename artifact
        shell: bash
        run: |
          cd out
          ZIP_FILE=$(find . -name "*.zip" -maxdepth 3 | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No zip file found in out/ directory"
            exit 1
          fi
          cp "$ZIP_FILE" "../${{ matrix.artifact_name }}"
          echo "Packaged: ${{ matrix.artifact_name }}"

      - name: Verify artifact version
        shell: bash
        run: |
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          echo "Expected version: $EXPECTED_VERSION"
          # Extract version from the packaged app name directory in out/
          PACKAGED_DIR=$(find out -maxdepth 1 -type d -name "ScratchJr*" | head -1)
          if [ -n "$PACKAGED_DIR" ]; then
            echo "Packaged directory: $PACKAGED_DIR"
          fi
          echo "Artifact: ${{ matrix.artifact_name }}"
          # Verify the zip file exists and is non-empty
          if [ ! -s "${{ matrix.artifact_name }}" ]; then
            echo "::error::Artifact ${{ matrix.artifact_name }} is missing or empty"
            exit 1
          fi
          echo "Artifact size: $(du -h ${{ matrix.artifact_name }} | cut -f1)"

      - name: Build MSI installer (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "Downloading WiX 3.x binaries..."
          curl -sL "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -o wix3.zip
          mkdir -p out/wix3
          unzip -q wix3.zip -d out/wix3
          echo "Building MSI..."
          node scripts/build-msi.js
          cp out/installer/ScratchJr.msi ScratchJr-win32-x64.msi
          echo "MSI created: ScratchJr-win32-x64.msi"

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          if [ "${{ matrix.release_suffix }}" = "windows" ]; then
            sha256sum "ScratchJr-win32-x64.msi" > "ScratchJr-win32-x64.msi.sha256"
          fi
          echo "SHA256 checksums:"
          cat *.sha256

      - name: Smoke test packaged app
        if: (runner.os == 'Windows' || runner.os == 'Linux') && !contains(matrix.release_suffix, 'arm64')
        shell: bash
        run: |
          PACKAGED_DIR=$(find out -maxdepth 1 -type d -name 'ScratchJr*' | head -1)
          if [ -z "$PACKAGED_DIR" ]; then
            echo "::error::No packaged directory found"
            exit 1
          fi
          echo "Smoke testing: $PACKAGED_DIR"
          if [ "${{ runner.os }}" = "Linux" ]; then
            ELECTRON_DISABLE_SANDBOX=1 xvfb-run --auto-servernum node scripts/smoke-packaged.js "$PACKAGED_DIR"
          else
            node scripts/smoke-packaged.js "$PACKAGED_DIR"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_suffix }}-build
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
            *.msi
            *.msi.sha256
          if-no-files-found: error
          retention-days: 5

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.msi
            artifacts/**/*.sha256
          body: |
            ## ScratchJr Desktop ${{ github.ref_name }}

            Fork of [JustSch/ScratchJr-Desktop](https://github.com/JustSch/ScratchJr-Desktop) — credit to the original authors and [LLK/ScratchJr](https://github.com/LLK/scratchjr) by MIT.

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/master/README.md#changes-in-this-fork) for full details.

            ### Downloads

            | File | Platform |
            |------|----------|
            | `ScratchJr-win32-x64.msi` | Windows x64 (installer) |
            | `ScratchJr-win32-x64.zip` | Windows x64 (portable) |
            | `ScratchJr-darwin-x64.zip` | macOS x64 |
            | `ScratchJr-darwin-arm64.zip` | macOS ARM64 |
            | `ScratchJr-linux-x64.zip` | Linux x64 |
            | `ScratchJr-linux-arm64.zip` | Linux ARM64 |

            ### Checksums (SHA256)

            Download the `.sha256` files alongside each artifact to verify integrity.
